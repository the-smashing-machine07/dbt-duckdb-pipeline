# This is the name of our project
name: analytics

# This is the name of our profile, same as project unless specified otherwise
profile: analytics


seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]

# These are the directories that are deleted when we execute 'dbt clean' command
clean-targets:
  - "target"
  - "dbt_packages"

# Project wide making all models as tables in the database
# Now you need not go to all the models individually and add config to change it to tables
models:
  analytics:
    +materialized: table
